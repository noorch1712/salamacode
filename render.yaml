# render.yaml - Deploy backend SalamaCode di Render (free tier)
# Cara pakai: buat New > Web Service, hubungkan repo ini,
# Render auto-detect render.yaml. Set env vars di dashboard.
services:
  - type: web
    name: salamacode-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ENABLE_TERMINAL
        value: "false"
      - key: APP_URL
        sync: false